name: CI/CD

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release, security]
  workflow_dispatch:

permissions:
  contents: read

# Un seul run par branche ; un déploiement en cours sur release n'est jamais annulé
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Échoue sur toute faille haute ou critique absente de la liste d'exceptions (audit-ci.jsonc)
      - name: Audit des dépendances
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  build:
    name: build
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

  deploy:
    name: deploy
    needs: [security-audit, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global vercel@63.1.2

      # Récupère la configuration et les variables VITE_* du projet Vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
